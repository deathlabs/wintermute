services:

  wintermute:
    profiles: [all]
    build: 
      context: mcp-server
    image: wintermute/mcp:latest
    container_name: wintermute_mcp
    ports:
      - "8002:8002"
    environment:
      FASTMCP_PORT: "8002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8002/api/v1/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 5s
